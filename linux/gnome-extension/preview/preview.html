<!doctype html>
<!-- A faithful HTML mock of the GNOME extension (same texts, sizes and colors as extension.js and
     stylesheet.css) on an Ubuntu 22.04 desktop, for README screenshots made on a Mac.
     preview.html?s=<state>, states listed in shoot.sh, which renders them all. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 100vh; overflow: hidden; font: 14.5px/1.35 Ubuntu, sans-serif; color: #eee;
         background: radial-gradient(120% 90% at 75% 110%, #e95420 0%, #9b2c5a 30%, #3b1440 62%, #200a24 100%); }
  .bar { height: 32px; background: #000; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 10px; font-weight: 500; }
  .bar .l { justify-self: start; padding: 0 10px; }
  .bar .c, .bar .r { display: flex; align-items: center; gap: 2px; }
  .bar .r { justify-self: end; }
  .pill { position: relative; display: flex; align-items: center; gap: 4px; padding: 3px 12px; border-radius: 99px; height: 28px; }
  .pill.open { background: rgba(255,255,255,0.22); }
  .pill svg.u { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .tnum { font-variant-numeric: tabular-nums; font-weight: 700; }
  .dots { color: #f5a524; letter-spacing: 1px; }
  .sys svg { width: 16px; height: 16px; }
  .dock { position: absolute; left: 0; top: 32px; bottom: 0; width: 62px; background: rgba(20,20,20,0.75); display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 12px; }
  .dock i { width: 42px; height: 42px; border-radius: 10px; display: block; }

  .menu { position: absolute; top: 38px; background: #353535; border: 1px solid rgba(0,0,0,0.6); border-radius: 12px;
          padding: 8px 0 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
  .card { padding: 4px 14px 10px; display: flex; flex-direction: column; gap: 10px; }
  .sep { height: 1px; background: rgba(255,255,255,0.1); margin: 6px 12px; }
  .item { padding: 7px 16px; display: flex; justify-content: space-between; align-items: center; }
  .switch { width: 40px; height: 22px; border-radius: 11px; background: #e95420; position: relative; }
  .switch::after { content: ""; position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  .switch.off { background: rgba(255,255,255,0.2); }
  .switch.off::after { right: auto; left: 2px; }

  .row { display: flex; gap: 6px; align-items: center; }
  .spacer { flex: 1; }
  .task { font-weight: 700; }
  .muted { color: rgba(255,255,255,0.6); font-size: 0.9em; }
  .big { font-size: 2.6em; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .huge { font-size: 3.4em; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .paused { color: #f5a524; }
  .stat b { display: block; font-size: 1.3em; }
  .gbar { width: 300px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); display: flex; overflow: hidden; }
  .entry { height: 34px; border-radius: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); padding: 7px 10px; color: rgba(255,255,255,0.45); }
  .entry.filled { color: #eee; }
  .entry.focus { border: 2px solid #e95420; padding: 6px 9px; }
  .button { padding: 6px 14px; border-radius: 8px; background: rgba(255,255,255,0.1); text-align: center; white-space: nowrap; }
  .primary { background: #29c26e; color: #04220f; font-weight: 700; }
  .ib { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: rgba(255,255,255,0.65); }
  .ib.on { background: rgba(255,255,255,0.16); color: #fff; }
  .ib svg { width: 16px; height: 16px; }
  .chip { padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,0.09); font-size: 0.9em; white-space: nowrap; }
  .chip.on { background: #29c26e; color: #04220f; }
  .heat { display: flex; gap: 2px; }
  .heat div { display: flex; flex-direction: column; gap: 2px; }
  .heat i { border-radius: 2px; display: block; box-sizing: border-box; }
  .hl { position: relative; height: 14px; font-size: 0.7em; color: rgba(255,255,255,.5); font-variant-numeric: tabular-nums; }
  .hl span { position: absolute; top: 0; white-space: nowrap; }
  .now { color: #fff !important; font-weight: 700; }
  .mon { font-size: .8em; font-weight: 700; color: rgba(255,255,255,.65); }
  .cal { display: flex; flex-direction: column; gap: 2px; }
  .cal .r { display: flex; gap: 2px; align-items: center; }
  .cal .n { font-size: .7em; color: rgba(255,255,255,.5); text-align: right; font-variant-numeric: tabular-nums; }
  .breath { border-radius: 50%; background: rgba(245,165,36,0.35); border: 2px solid #f5a524; }
  .clip { padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.06); flex: 1; min-width: 0; }
  .clip.pinned { border: 1px solid rgba(41,194,110,0.6); }
  .clip .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .thumb { border-radius: 8px; flex: none; }
  .tile { position: absolute; border-radius: 12px; border: 2px solid transparent; overflow: hidden; }
  .tile.on { border-color: #29c26e; }
  .note { background: #1d3b2b; color: #d9f5e5; padding: 8px 10px; font-size: 0.85em; }
  .caption { position: absolute; right: 18px; bottom: 14px; font-size: 12px; color: rgba(255,255,255,0.55); }
</style>
</head>
<body>
<div class="bar"><div class="l">Activities</div><div class="c" id="center"></div><div class="r" id="right"></div></div>
<div class="dock"><i style="background:#3d8ee6"></i><i style="background:#e95420"></i><i style="background:#4a4a4a"></i><i style="background:#2d9c5a"></i><i style="background:#7a5bc7"></i></div>
<div id="stage"></div>

<script type="module">
import * as Core from '../gnotch@christianqp4.github.io/core.js';
const s = new URLSearchParams(location.search).get('s') || 'idle';
const ICON = '<svg width="16" height="16" viewBox="0 0 16 16"><path fill="#eee" d="M2 3.5h12v2.2c0 2.1-1.7 3.8-3.8 3.8H5.8C3.7 9.5 2 7.8 2 5.7z" opacity=".35"/><path fill="none" stroke="#eee" stroke-width="1.6" stroke-linecap="round" d="M2.8 3.5h10.4v2.2a3 3 0 0 1-3 3H5.8a3 3 0 0 1-3-3z"/><circle cx="8" cy="12.5" r="1.6" fill="#eee"/></svg>';
const I = {
  timer: '<svg viewBox="0 0 16 16"><circle cx="8" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 6v3.2l2 1.3M2.5 3.5l2-1.5M13.5 3.5l-2-1.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>',
  clip: '<svg viewBox="0 0 16 16"><rect x="3" y="2.5" width="10" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="5.5" y="1" width="5" height="3" rx="1" fill="currentColor"/></svg>',
  vision: '<svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 12l3.5-4 2.5 3 2-2 2.5 3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="11" cy="5.5" r="1.2" fill="currentColor"/></svg>',
  big: '<svg viewBox="0 0 16 16"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>',
  small: '<svg viewBox="0 0 16 16"><path d="M6 2v4H2M10 2v4h4M6 14v-4H2M10 14v-4h4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>',
  up: '<svg viewBox="0 0 16 16"><path d="M3 10.5l5-5 5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>',
  star: '<svg viewBox="0 0 16 16"><path d="M8 1.8l1.9 4 4.3.5-3.2 2.9.9 4.3L8 11.3l-3.9 2.2.9-4.3L1.8 6.3l4.3-.5z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
  starOn: '<svg viewBox="0 0 16 16"><path d="M8 1.8l1.9 4 4.3.5-3.2 2.9.9 4.3L8 11.3l-3.9 2.2.9-4.3L1.8 6.3l4.3-.5z" fill="#29c26e"/></svg>',
  del: '<svg viewBox="0 0 16 16"><path d="M3 4.5h10M6 4.5V3h4v1.5M4.5 4.5l.7 9h5.6l.7-9" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>',
  prev: '<svg viewBox="0 0 16 16"><path d="M10 3l-5 5 5 5" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>',
  next: '<svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>',
};
const SYS = '<span class="pill sys"><svg viewBox="0 0 16 16"><path fill="#eee" d="M8 3C5 3 2.4 4.2.6 6.1L8 14l7.4-7.9C13.6 4.2 11 3 8 3z"/></svg><svg viewBox="0 0 16 16"><path fill="#eee" d="M2 6h3l4-3v10L5 10H2z"/></svg><svg viewBox="0 0 16 16"><rect x="1" y="4.5" width="12" height="7" rx="1.5" fill="none" stroke="#eee" stroke-width="1.3"/><rect x="2.5" y="6" width="7" height="4" fill="#eee"/></svg><svg viewBox="0 0 16 16"><path fill="#eee" d="M3.5 6l4.5 4.5L12.5 6z"/></svg></span>';
const CLOCK = '<span class="pill">Oct 13  18:30</span>';

/// The progress "U" around the indicator, same geometry as Core.uOutline (inset = width/2 + 1.5).
function uPath(w, h, inset) {
  const r = (h - 2 * inset) / 2, top = inset, bottom = h - inset, left = inset + r, right = w - inset - r;
  return `M ${left} ${top} A ${r} ${r} 0 0 0 ${left} ${bottom} L ${right} ${bottom} A ${r} ${r} 0 0 0 ${right} ${top}`;
}
function outline(w, h, fraction, color) {
  const d = uPath(w, h, 2.75), len = 2 * Math.PI * ((h - 5.5) / 2) + (w - 5.5 - (h - 5.5));
  return `<svg class="u" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${len * fraction} ${len}"/></svg>`;
}
function gnotch(state, open) {
  const t = {running: ['32:14', '••', '#29c26e', 0.36], paused: ['31:02', '•••', '#f5a524', 0.38]}[state];
  const w = t ? 128 : state === 'finish' ? 120 : 46;
  const inner = t ? `${ICON}<span class="tnum ${state === 'paused' ? 'paused' : ''}">${t[0]}</span><span class="dots">${t[1]}</span>`
    : state === 'finish' ? `${ICON}<span class="tnum">Log block</span>` : ICON;
  return `<span class="pill ${open ? 'open' : ''}" style="width:${w}px;justify-content:center">${inner}${t ? outline(w, 28, t[3], t[2]) : ''}</span>`;
}

// Sample data, seeded so every render matches.
const NOW = new Date(2026, 9, 13, 18, 30).getTime();
const sessions = (() => {
  let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const out = [];
  for (let back = 300; back >= 0; back--) {
    const day = new Date(2026, 9, 13 - back);
    if (rnd() > (back < 60 ? 0.85 : 0.55)) continue;
    let t = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 8 + Math.floor(rnd() * 3), Math.floor(rnd() * 50)).getTime();
    for (let k = 0, n = 1 + Math.floor(rnd() * 3); k < n; k++) {
      const mins = [25, 50, 50, 90, 75, 40][Math.floor(rnd() * 6)];
      if (t + mins * 60000 > NOW) break;
      out.push({start: Core.isoDate(t), end: Core.isoDate(t + mins * 60000), duration: mins * 60, intensity: 1 + Math.floor(rnd() * 5),
        task: ['Thesis chapter 3', 'Literature notes', 'Landing page', 'Email triage'][Math.floor(rnd() * 4)]});
      t += (mins + 30) * 60000;
    }
  }
  return out;
})();

const cellHtml = (d, cell) => {
  if (!d) return `<i style="width:${cell}px;height:${cell}px"></i>`;
  const future = d.level < 0;
  const border = d.today ? 'border:1px solid rgba(255,255,255,.85)' : future ? 'border:1px solid rgba(255,255,255,.14)' : '';
  return `<i style="width:${cell}px;height:${cell}px;background:${future ? 'transparent' : Core.HEAT[d.level]};${border}"></i>`;
};
const labels = (list, cell, width) => `<div class="hl" style="width:${width}px">${list.map(l => `<span class="${l.current ? 'now' : ''}" style="left:${l.col * (cell + 2)}px">${l.text}</span>`).join('')}</div>`;
function yearHtml(weeks, cell, weekdays) {
  const y = Core.heatYear(sessions, NOW, weeks), width = weeks * (cell + 2);
  const grid = `<div class="heat">${y.columns.map(c => `<div>${c.days.map(d => cellHtml(d.level < 0 ? null : d, cell)).join('')}</div>`).join('')}</div>`;
  const body = `<div style="display:flex;flex-direction:column;gap:2px">${labels(y.monthLabels, cell, width)}${grid}${labels(y.weekLabels, cell, width)}</div>`;
  if (!weekdays) return body;
  const days = `<div style="display:flex;flex-direction:column;gap:2px;padding-top:16px">${Core.DAY_NAMES.map((n, i) => `<span class="n" style="height:${cell}px;line-height:${cell}px;font-size:${Math.max(7, cell * .8)}px">${i % 2 === 0 ? n : ''}</span>`).join('')}</div>`;
  return `<div style="display:flex;gap:6px">${days}${body}</div>`;
}
function calHtml(count, cell, perRow) {
  const months = Core.heatMonths(sessions, NOW, count), numW = Math.round(cell * 1.6);
  let out = `<div style="display:flex;flex-direction:column;gap:${cell}px">`;
  for (let i = 0; i < months.length; i += perRow) {
    out += `<div style="display:flex;gap:${Math.round(cell * 1.3)}px">`;
    for (const m of months.slice(i, i + perRow)) {
      out += `<div class="cal"><span class="mon ${m.current ? 'now' : ''}" style="padding-left:${numW + 2}px">${m.title}</span>
        <div class="r"><span style="width:${numW}px"></span>${Core.DAY_NAMES.map(n => `<span class="n" style="width:${cell}px;text-align:center">${n[0]}</span>`).join('')}</div>
        ${m.weeks.map(w => `<div class="r"><span class="n ${w.current ? 'now' : ''}" style="width:${numW}px;height:${cell}px;line-height:${cell}px">${w.week}</span>${w.days.map(d => cellHtml(d, cell)).join('')}</div>`).join('')}</div>`;
    }
    out += '</div>';
  }
  return out + '</div>';
}
function info(large, hoverMs) {
  if (hoverMs === undefined) {
    const st = Core.streak(sessions, NOW);
    return (large ? '' : `<div class="muted">Today ${Core.hm(Core.totalSince(sessions, Core.startOfDay(NOW)))} · this week ${Core.hm(Core.totalSince(sessions, Core.startOfWeek(NOW)))} · streak ${st} days</div>`)
      + '<div class="muted">Point at a day to see its blocks.</div>';
  }
  const b = Core.dayBrief(sessions, hoverMs, NOW);
  return `<div class="row" style="gap:8px"><span class="task">${b.title}</span><span class="muted">${b.summary}</span></div>`
    + b.blocks.slice(0, 3).map(x => `<div class="row" style="gap:6px"><span style="width:7px;height:7px;border-radius:4px;background:${x.color}"></span><span>${x.time}</span><span style="color:${x.color}">${x.intensity}</span><span class="muted">${x.task}</span></div>`).join('');
}
function heatSection(large, style, hoverMs) {
  const grid = style === 'calendar' ? calHtml(large ? 12 : 3, large ? 9 : 8, large ? 6 : 3) : yearHtml(large ? 53 : 24, 9, large);
  return `<div style="display:flex;flex-direction:column;gap:6px">
    <div class="row"><span class="muted">${large ? 'Last 12 months · ' : ''}${Core.weekLabel(NOW)}</span><span class="spacer"></span><span class="chip ${style === 'year' ? 'on' : ''}">Year</span><span class="chip ${style === 'calendar' ? 'on' : ''}">Calendar</span></div>
    ${grid}<div style="display:flex;flex-direction:column;gap:3px;min-height:${large ? 58 : 76}px">${info(large, hoverMs)}</div></div>`;
}
const hoverDay = new Date(2026, 9, 11, 12).getTime();

const bar = segs => `<div class="gbar">${segs.map(([w, k]) => `<span style="width:${w}px;background:${k === 'd' ? '#f5a524' : '#29c26e'}"></span>`).join('')}</div>`;
const chips = (list, on, style = '') => `<div class="row">${list.map(x => `<span class="chip ${x === on ? 'on' : ''}" ${x === on ? style : ''}>${x}</span>`).join('')}</div>`;
const header = (page, large) => `<div class="row" style="gap:4px">
  <span class="ib ${page === 'timer' ? 'on' : ''}">${I.timer}</span><span class="ib ${page === 'clip' ? 'on' : ''}">${I.clip}</span><span class="ib ${page === 'vision' ? 'on' : ''}">${I.vision}</span>
  <span class="spacer"></span><span class="ib">${large ? I.small : I.big}</span><span class="ib">${I.up}</span></div>`;
const breath = (size, scale) => `<div class="breath" style="width:${size}px;height:${size}px;transform:scale(${scale})"></div>`;

const clips = [
  {t: 'https://gnome.pages.gitlab.gnome.org/gjs/', app: 'Firefox', when: '2m', pin: true},
  {img: 'linear-gradient(135deg,#2b5876,#4e4376)', t: 'Image · 1920×1080', app: 'Screenshot', when: '5m'},
  {t: 'Deep work is the ability to focus without distraction on a cognitively demanding task.', app: 'Text Editor', when: '12m'},
  {t: 'sudo apt install zenity', app: 'Terminal', when: '1h'},
  {t: 'thesis-chapter-3-draft.odt', app: 'Files', when: '2h'},
  {img: 'linear-gradient(135deg,#f7971e,#ffd200)', t: 'Image · 800×600', app: 'Firefox', when: '3h'},
  {t: 'Meeting moved to Thursday 10:00, same room.', app: 'Thunderbird', when: '5h'},
  {t: 'npm run build && npm test', app: 'Terminal', when: '1d'},
];
function clipRow(c, large) {
  const content = c.img
    ? `<div class="row" style="gap:8px"><div class="thumb" style="width:${large ? 96 : 72}px;height:${large ? 64 : 48}px;background:${c.img}"></div><span class="t">${c.t}</span></div>`
    : `<span class="t">${c.t}</span>`;
  return `<div class="row" style="gap:4px"><div class="clip ${c.pin ? 'pinned' : ''}">${content}<div class="muted">${c.when} · ${c.app}</div></div>
    <div style="display:flex;flex-direction:column;gap:2px"><span class="ib">${c.pin ? I.starOn : I.star}</span><span class="ib">${I.del}</span></div></div>`;
}
function clipboardPage(large) {
  const list = large ? clips : clips.slice(0, 5);
  const cols = large ? [list.filter((_, i) => i % 2 === 0), list.filter((_, i) => i % 2)] : [list];
  return `<div class="entry focus">Search everything you copied</div>
    ${chips(['All', 'Text', 'Images', 'Files', 'Screenshots'], 'All')}
    <div class="row" style="align-items:flex-start;gap:8px">${cols.map(c => `<div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0">${c.map(x => clipRow(x, large)).join('')}</div>`).join('')}</div>`;
}

const visionItems = [
  {c: 3, r: 2, bg: 'linear-gradient(160deg,#89f7fe,#66a6ff)'},
  {c: 2, r: 3, bg: 'linear-gradient(160deg,#ff9a9e,#fad0c4)'},
  {c: 1, r: 1, bg: 'linear-gradient(160deg,#a1c4fd,#c2e9fb)'},
  {c: 2, r: 1, note: 'Finish the thesis by December'},
  {c: 2, r: 2, bg: 'linear-gradient(160deg,#fbc2eb,#a6c1ee)', on: true},
  {c: 3, r: 1, note: 'Run the half marathon in under 2 hours'},
  {c: 2, r: 2, bg: 'linear-gradient(160deg,#d4fc79,#96e6a1)'},
];
function visionPage(large) {
  const cell = large ? 104 : 46, gap = 6, cols = 6;
  const occ = []; let html = '', rows = 0;
  const fits = (c, r, w, h) => { for (let y = r; y < r + h; y++) for (let x = c; x < c + w; x++) if ((occ[y] ??= [])[x]) return false; return true; };
  for (const it of visionItems) {
    let placed = false;
    for (let r = 0; !placed; r++) for (let c = 0; c <= cols - it.c && !placed; c++) if (fits(c, r, it.c, it.r)) {
      for (let y = r; y < r + it.r; y++) for (let x = c; x < c + it.c; x++) occ[y][x] = true;
      const w = it.c * cell + (it.c - 1) * gap, h = it.r * cell + (it.r - 1) * gap;
      html += `<div class="tile ${it.note ? 'note' : ''} ${it.on ? 'on' : ''}" style="left:${c * (cell + gap)}px;top:${r * (cell + gap)}px;width:${w}px;height:${h}px;${it.bg ? `background:${it.bg}` : ''};${large && it.note ? 'font-size:1.15em;font-weight:700' : ''}">${it.note ?? ''}</div>`;
      rows = Math.max(rows, r + it.r); placed = true;
    }
  }
  const W = cols * cell + (cols - 1) * gap, H = rows * cell + (rows - 1) * gap;
  return `<div class="row"><span class="button">Paste</span><span class="button">Add images…</span><span class="button">Tidy</span></div>
    <div class="entry">Add a goal or a quote (Enter)</div>
    <div style="position:relative;width:${W}px;height:${H}px">${html}</div>
    <div class="row"><span class="button">Size 2×2</span><span class="ib">${I.prev}</span><span class="ib">${I.next}</span><span class="button">Open</span><span class="spacer"></span><span class="button">Remove</span></div>`;
}

function ring(size, fraction, color, inner) {
  const lw = 10, r = size / 2 - lw, c = 2 * Math.PI * r;
  return `<div style="position:relative;width:${size}px;height:${size}px;display:grid;place-items:center">
    <svg width="${size}" height="${size}" style="position:absolute;inset:0"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="${lw}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${lw}" stroke-linecap="round" stroke-dasharray="${c * fraction} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>
    <div style="position:relative;text-align:center">${inner}</div></div>`;
}
const todayRow = (dot, task, bits) => `<div class="row" style="gap:8px"><span style="width:8px;height:8px;border-radius:4px;background:${dot}"></span><span>${task}</span><span class="spacer"></span><span class="muted">${bits}</span></div>`;

const cards = {
  idle: [340, header('timer') + `
    <div class="entry focus">What are you working on?</div>
    ${chips(['25','50','90','120','∞'], '50')}
    <div class="button primary">Start block</div>
    ${heatSection(false, 'year')}`],
  running: [340, header('timer') + `
    <div class="row"><span class="task">Thesis chapter 3</span><span class="spacer"></span><span class="muted">50 min block</span></div>
    <div class="big">32:14</div>
    ${bar([[96,'f'],[8,'d'],[52,'f'],[5,'d'],[40,'f']])}
    <div class="row"><span class="button">I drifted</span><span class="button">Finish</span><span class="spacer"></span><span class="muted">2 drifts</span></div>`],
  paused: [340, header('timer') + `
    <div class="row"><span class="task">Thesis chapter 3</span><span class="spacer"></span><span class="muted">50 min block</span></div>
    <div class="big paused">31:02</div>
    ${bar([[90,'f'],[8,'d'],[48,'f'],[5,'d'],[42,'f'],[14,'d']])}
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0">${breath(72, 0.8)}<span class="muted">Breathe in · 2</span></div>
    <div class="row"><span class="button primary">Back to focus</span><span class="button">Finish</span><span class="spacer"></span><span class="muted">3 drifts</span></div>`],
  finish: [340, header('timer') + `
    <span class="task">52m of deep work · 2 drifts</span>
    <div class="entry filled">Thesis chapter 3</div>
    <span class="muted">Intensity: Deep</span>
    ${chips(['1','2','3','4','5'], '4', 'style="background:#ff6b2e;color:#000"')}
    <span class="muted">How did it feel?</span>
    <div class="row"><span class="chip on">Flow</span><span class="chip">Energized</span><span class="chip on">Calm</span><span class="chip">Clear-headed</span></div>
    <div class="row"><span class="chip">Distracted</span><span class="chip">Tired</span><span class="chip">Restless</span><span class="chip">Breakthrough</span></div>
    <span class="muted">Where?</span>
    ${chips(['Library','House','Coworking','Coffee'], 'Library')}
    <div class="entry">Other place… (Enter)</div>
    <div class="entry focus">Notes: what helped, what pulled you out</div>
    <div class="row"><span class="button primary">Save</span><span class="button">Discard</span></div>`],
  large: [720, header('timer', true) + `
    <div class="row" style="gap:28px;align-items:flex-start">
      <div style="width:260px;display:flex;flex-direction:column;gap:12px;align-items:center">
        ${ring(230, 0.36, '#29c26e', '<div class="huge">32:14</div><div class="muted">Thesis chapter 3</div>')}
        <div class="row" style="width:100%"><span class="button">I drifted</span><span class="button">Finish</span><span class="spacer"></span><span class="muted">2 drifts</span></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:10px">
        ${bar([[96,'f'],[8,'d'],[52,'f'],[5,'d'],[40,'f']])}
        <span class="task">Today</span>
        ${todayRow('#ff6b2e', 'Literature notes', '09:12 · 52m · Deep · Library')}
        ${todayRow('#ff8c33', 'Email triage', '11:00 · 25m · Focused · House')}
        <div class="row" style="gap:24px;padding-top:8px">
          <div class="stat muted">Today<b style="color:#eee">1h 17m</b></div><div class="stat muted">This week<b style="color:#eee">7h 40m</b></div>
          <div class="stat muted">Streak<b style="color:#eee">6 days</b></div><div class="stat muted">Drifts / hour<b style="color:#eee">1.4</b></div>
        </div>
      </div>
    </div>
    ${heatSection(true, 'year')}`],
  'large-paused': [720, header('timer', true) + `
    <div class="row" style="gap:28px;align-items:flex-start">
      <div style="width:260px;display:flex;flex-direction:column;gap:12px;align-items:center">
        <div style="position:relative">${ring(230, 0.38, '#f5a524', '<div class="huge paused">31:02</div><div class="muted">Thesis chapter 3</div>')}
          <div style="position:absolute;left:30px;top:30px;pointer-events:none">${breath(170, 0.92).replace('rgba(245,165,36,0.35)', 'rgba(245,165,36,0.18)')}</div></div>
        <span class="muted">Breathe out · 4</span>
        <div class="row" style="width:100%"><span class="button primary">Back to focus</span><span class="button">Finish</span><span class="spacer"></span><span class="muted">3 drifts</span></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:10px">
        ${bar([[90,'f'],[8,'d'],[48,'f'],[5,'d'],[42,'f'],[14,'d']])}
        <span class="task">Today</span>
        ${todayRow('#ff6b2e', 'Literature notes', '09:12 · 52m · Deep · Library')}
        ${todayRow('#ff8c33', 'Email triage', '11:00 · 25m · Focused · House')}
      </div>
    </div>`],
  clipboard: [340, header('clip') + clipboardPage(false)],
  'clipboard-large': [720, header('clip', true) + clipboardPage(true)],
  vision: [340, header('vision') + visionPage(false)],
  'vision-large': [720, header('vision', true) + visionPage(true)],
};

const idleTop = header('timer') + `
    <div class="entry focus">What are you working on?</div>
    ${chips(['25','50','90','120','∞'], '50')}
    <div class="button primary">Start block</div>`;
cards['idle-calendar'] = [340, idleTop + heatSection(false, 'calendar')];
cards['idle-hover'] = [340, idleTop + heatSection(false, 'year', hoverDay)];
cards['large-calendar'] = [720, cards.large[1].replace(heatSection(true, 'year'), heatSection(true, 'calendar', hoverDay))];

const center = document.getElementById('center'), right = document.getElementById('right'), stage = document.getElementById('stage');
right.innerHTML = SYS;
const topState = s === 'idle' || s === 'clipboard' || s === 'clipboard-large' || s === 'vision' || s === 'vision-large' ? 'running' : s.includes('paused') ? 'paused' : s === 'finish' ? 'finish' : 'running';
if (s === 'placement') {
  center.innerHTML = CLOCK + gnotch('running', false);
  stage.innerHTML = `
    <div style="position:absolute;left:62px;right:0;top:110px;text-align:center;font-size:15px;color:rgba(255,255,255,.85)">The block's progress traced around the indicator, like the line around the notch: green while focused, orange when paused</div>
    <div style="position:absolute;left:62px;right:0;top:170px;display:flex;justify-content:center;gap:40px;transform:scale(2);transform-origin:center top">
      <span style="background:#000;padding:6px 10px;border-radius:8px">${gnotch('running', false)}</span>
      <span style="background:#000;padding:6px 10px;border-radius:8px">${gnotch('paused', false)}</span>
    </div>
    <div style="position:absolute;left:62px;right:0;top:300px;text-align:center;font-size:15px;color:rgba(255,255,255,.85)">“Next to the clock” off: with the system icons</div>
    <div style="position:absolute;left:300px;right:200px;top:335px;height:32px;background:#000;border-radius:6px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px;font-weight:500">
      <span>Activities</span><span>${CLOCK}</span><span style="justify-self:end;display:flex">${gnotch('running', false)}${SYS}</span></div>`;
} else {
  center.innerHTML = CLOCK + gnotch(s.startsWith('idle') ? 'idle' : topState, true);
  const [w, body] = cards[s];
  const items = `<div class="sep"></div>
    <div class="item"><span>Next to the clock</span><span class="switch"></span></div>
    <div class="item"><span>Pause clipboard history</span><span class="switch off"></span></div>
    <div class="item"><span>Clear clipboard history (keeps pins)</span></div>
    <div class="item"><span>Open data folder</span></div>`;
  const menuW = w + 30;
  stage.innerHTML = `<div class="menu" style="width:${menuW}px;left:${Math.max(80, 1200 / 2 - menuW / 2 + 40)}px"><div class="card">${body}</div>${items}</div>`;
}
document.body.insertAdjacentHTML('beforeend', '<div class="caption">Preview mock-up, not a live capture</div>');
</script>
</body>
</html>
