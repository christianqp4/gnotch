# Tests the GNOME extension on every push; on a tag like gnome-v0.5.0 it also publishes
# gnotch-gnome-<version>.zip as a GitHub release (visible to collaborators of this private repo).
name: GNOME extension

on:
  push:
    paths: ['linux/gnome-extension/**', '.github/workflows/gnome-release.yml']
    tags: ['gnome-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test core logic
        run: node --test linux/gnome-extension/test/core.test.mjs
      - name: Check extension syntax
        run: node --check "linux/gnome-extension/gnotch@christianqp4.github.io/extension.js"
      - name: Package (zip)
        id: pkg
        run: echo "zip=linux/gnome-extension/$(linux/gnome-extension/package.sh)" >> "$GITHUB_OUTPUT"
      - name: Package (.deb)
        id: deb
        run: echo "deb=linux/gnome-extension/$(linux/gnome-extension/package-deb.sh)" >> "$GITHUB_OUTPUT"
      - name: Test the .deb (install, check, remove)
        run: |
          deb="${{ steps.deb.outputs.deb }}"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          # The runner has no GNOME, so skip the dependency check; postinst falls back to the 45+ build.
          sudo dpkg -i --force-depends "$deb"
          ext=/usr/share/gnome-shell/extensions/gnotch@christianqp4.github.io
          test -L "$ext"
          test -f "$ext/metadata.json"
          test -f "$ext/extension.js"
          test -x /usr/bin/gnotch
          test -f /usr/share/applications/gnotch.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/gnotch.png
          grep -q '^Exec=gnotch timer' /usr/share/applications/gnotch.desktop
          if command -v desktop-file-validate >/dev/null; then desktop-file-validate /usr/share/applications/gnotch.desktop; fi
          sudo dpkg -r gnotch
          test ! -e "$ext"
          test ! -e /usr/bin/gnotch
      - uses: actions/upload-artifact@v4
        with:
          name: gnotch-gnome
          path: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.deb.outputs.deb }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/gnome-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#gnome-v}"
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="Ubuntu $version" 'index($0, "## " v) == 1 {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          gh release create "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.zip }}" "${{ steps.deb.outputs.deb }}" \
            --title "GNotch for Ubuntu (GNOME) $version" --notes-file notes.md
